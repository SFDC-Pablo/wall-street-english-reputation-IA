<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Réputation IA — boucle écran</title>
<style>
:root{--p:#0b5cff;--a:#6fd0ff;--bg:#020a3a;--w2:rgba(255,255,255,.82);--sans:"Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:var(--sans);overflow:hidden;cursor:none}
em{font-style:normal;color:var(--a)}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7vh 6vw;
  background:radial-gradient(ellipse at 20% 110%,color-mix(in srgb,var(--p) 55%,transparent),transparent 60%),radial-gradient(ellipse at 90% -10%,color-mix(in srgb,var(--a) 22%,transparent),transparent 55%),var(--bg);
  opacity:0;visibility:hidden;transform:scale(1.04);filter:blur(10px);transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.75,.2,1),filter .8s ease,visibility 0s linear 1.1s}
.sc.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.75,.2,1),filter .8s ease,visibility 0s}
.sc.alt{background:radial-gradient(ellipse at 80% 110%,color-mix(in srgb,var(--a) 30%,transparent),transparent 60%),radial-gradient(ellipse at 10% -10%,color-mix(in srgb,var(--p) 70%,transparent),transparent 60%),var(--bg)}
h1{font-size:clamp(56px,7.4vw,140px);line-height:1.02;font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(42px,4.8vw,92px);line-height:1.08;font-weight:800;letter-spacing:-.02em}
.lbl{font-size:clamp(13px,1vw,18px);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--a);margin-bottom:2vh}
.sub{font-size:clamp(20px,2vw,38px);color:var(--w2);margin-top:2.4vh;line-height:1.35}
.demo{position:absolute;left:50%;bottom:3vh;translate:-50% 0;font-size:clamp(11px,.85vw,15px);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.in{opacity:0;transform:translateY(26px);filter:blur(8px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .7s ease;transition-delay:var(--d,.2s)}
.sc.on .in{opacity:1;transform:none;filter:none}
.wd{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(8px);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .5s ease;transition-delay:calc(var(--i)*60ms + .25s)}
.sc.on .wd{opacity:1;transform:none;filter:none}
.logo{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.02em}
.logo img{display:block;max-height:100%;max-width:100%}
.clogo{height:12vh;min-width:12vh;padding:0 3vh;border-radius:2.4vh;background:var(--p);color:var(--a);font-size:7vh;box-shadow:0 0 0 .6vh color-mix(in srgb,var(--a) 40%,transparent)}
.clogo.img{background:#fff;padding:1.6vh 2.4vh}
.sflogo{height:14vh;display:inline-block}.sflogo img{height:100%;width:auto;display:block;filter:drop-shadow(0 1vh 3vh rgba(0,0,0,.35))}
.x{font-size:6vh;color:var(--a);font-weight:300}
.duo{display:flex;align-items:center;gap:3vw}
#s-intro{background:radial-gradient(ellipse at center,color-mix(in srgb,var(--p) 45%,#01030f),#01030f 72%)}
#s-intro.on .duo{animation:ilogo 4.6s ease forwards}
@keyframes ilogo{0%{opacity:0;transform:scale(.9);filter:blur(12px)}20%{opacity:1;transform:none;filter:none}75%{opacity:1;transform:scale(1.04);filter:drop-shadow(0 0 30px var(--a))}100%{opacity:0;transform:scale(1.25);filter:blur(14px)}}
.iline{position:absolute;left:15vw;right:15vw;top:calc(50% + 10vh);height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent);transform:scaleX(0)}
#s-intro.on .iline{animation:iline 1.6s cubic-bezier(.2,.8,.2,1) 1s forwards}@keyframes iline{to{transform:scaleX(1)}}
.iflash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.9),color-mix(in srgb,var(--a) 45%,transparent) 28%,transparent 62%)}
#s-intro.on .iflash{animation:iflash 1.3s ease 4.1s forwards}@keyframes iflash{35%{opacity:1}100%{opacity:0}}
.orbs i{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:orb 9s ease-in-out infinite}
.orbs i:nth-child(1){width:42vw;height:42vw;right:-6vw;top:-10vh;background:var(--p)}
.orbs i:nth-child(2){width:26vw;height:26vw;right:18vw;bottom:-12vh;background:var(--a);animation-delay:-3s;opacity:.35}
.orbs i:nth-child(3){width:18vw;height:18vw;left:6vw;top:8vh;background:var(--p);animation-delay:-6s;opacity:.4}
@keyframes orb{50%{transform:translate(3vw,-3vh) scale(1.12)}}
#s-cover .clogo{margin-bottom:4vh}
.chat{margin-top:4.5vh;display:flex;flex-direction:column;gap:1.6vh;align-items:center}
.bub{max-width:60vw;padding:1.8vh 2vw;border-radius:2.4vh;font-size:clamp(18px,1.7vw,32px);text-align:left}
.bub.q{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-bottom-right-radius:.6vh}
.bub.r{background:color-mix(in srgb,var(--p) 70%,#000);border:1px solid color-mix(in srgb,var(--a) 50%,transparent);border-bottom-left-radius:.6vh;min-width:20vw}
.dots i{display:inline-block;width:1.2vh;height:1.2vh;margin:0 .4vh;border-radius:50%;background:var(--a);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dot{50%{transform:translateY(-.8vh);opacity:.4}}
.ais{display:flex;gap:1.2vw;justify-content:center;margin-top:4vh;flex-wrap:wrap}
.ai{padding:1.2vh 1.6vw;border-radius:999px;background:#fff;color:#111;font-weight:800;font-size:clamp(14px,1.3vw,24px);opacity:0;transform:scale(.4);transition:opacity .5s ease,transform .7s cubic-bezier(.2,1.5,.4,1);transition-delay:calc(var(--k)*.18s + 1s);box-shadow:0 1.4vh 3vh rgba(0,0,0,.35)}
.sc.on .ai{opacity:1;transform:none}
.ring{position:relative;width:15vh;height:15vh;margin-top:5vh}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .bg{stroke:rgba(255,255,255,.15)}
.ring .fg{stroke:var(--a);stroke-linecap:round;stroke-dasharray:314;stroke-dashoffset:314;filter:drop-shadow(0 0 8px var(--a))}
#s-question.on .ring .fg{animation:ring 8s linear 1.2s forwards}@keyframes ring{to{stroke-dashoffset:0}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:5.6vh;font-weight:800}
.hint{font-size:clamp(16px,1.4vw,26px);color:var(--w2);margin-top:2.4vh}
.big{font-size:clamp(90px,13vw,240px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 50px color-mix(in srgb,var(--a) 60%,transparent)}
.pm{background:#fff;color:#1f2937;border-radius:2vh;box-shadow:0 4vh 10vh rgba(0,0,0,.5),0 0 0 .7vh color-mix(in srgb,var(--a) 25%,transparent);text-align:left;font-family:var(--sans);opacity:0;transform:scale(.9) translateY(30px);transition:all .9s cubic-bezier(.2,.8,.2,1) .35s}
.sc.on .pm{opacity:1;transform:none}
.pm-card{width:86vw;padding:3.4vh 2.6vw;margin-top:3vh}
.pm-top{display:flex;align-items:baseline;gap:1vw;margin-bottom:.8vh}.pm-top b{font-size:clamp(20px,2vw,36px)}.pm-top a{color:#2563eb;font-size:clamp(16px,1.5vw,28px);text-decoration:none}
.pm-desc{color:#6b7280;font-size:clamp(14px,1.2vw,22px);margin-bottom:2vh}
.pm-row{display:grid;grid-template-columns:1fr auto;gap:1.6vw;align-items:stretch}
.pm-sum{border:1px solid #d1d5db;border-radius:1.4vh;padding:2.4vh 1.6vw;font-size:clamp(16px,1.6vw,30px);line-height:1.5;color:#374151}
.hl{padding:.2vh .4vw;border-radius:.5vh;transition:box-shadow .5s}
.hl.g{background:#e7f6ec;color:#15803d}.hl.r{background:#fde8e8;color:#dc2626}
.sc.on .hl.g{animation:hlp 1.6s ease-in-out 2.4s 3}.sc.on .hl.r{animation:hlp2 1.6s ease-in-out 4.6s 3}
@keyframes hlp{50%{box-shadow:0 0 0 .5vh rgba(46,182,125,.45)}}@keyframes hlp2{50%{box-shadow:0 0 0 .5vh rgba(220,38,38,.4)}}
.pm-stats{display:flex;gap:1.8vw;border:1px solid #d1d5db;border-radius:1.4vh;padding:2vh 1.6vw}
.donut{text-align:center;width:9vw}.donut svg{width:7.2vw;height:7.2vw;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:11}.donut .bg{stroke:#d1d9e0}
.donut .fg{stroke-dasharray:0 1000;transition:stroke-dasharray 1.2s cubic-bezier(.4,0,.2,1)}
.donut b{display:block;font-size:clamp(18px,1.8vw,34px);margin-top:.6vh}.donut span{font-size:clamp(12px,1vw,18px);color:#6b7280}
.pm-foot{display:flex;justify-content:space-between;color:#9ca3af;font-size:clamp(12px,1vw,18px);margin-top:1.6vh}
.mx{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;text-align:left;max-width:80vw}
.mx .donut{width:auto}.mx .donut svg{width:34vh;height:34vh}.mx .donut circle{stroke-width:9}.mx .donut .bg{stroke:rgba(255,255,255,.15)}
.mx .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:9vh;font-weight:800;font-variant-numeric:tabular-nums}
.mx .dw{position:relative}
.mx h2{font-size:clamp(40px,4.4vw,84px)}
.mx p{font-size:clamp(20px,2vw,38px);color:var(--w2);margin-top:2vh;line-height:1.35}
.mx .ex{display:inline-block;margin-top:3vh;padding:1.2vh 1.4vw;border-radius:1.4vh;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-size:clamp(15px,1.4vw,26px)}
.pm-rank{width:84vw;padding:3vh 2.4vw;margin-top:2.6vh}
.pm-rank h3{font-size:clamp(20px,1.9vw,34px);margin-bottom:.6vh}.pm-rank .d{color:#6b7280;font-size:clamp(13px,1.1vw,20px);margin-bottom:2vh}
.rk{display:grid;grid-template-columns:5vw 14vw 1fr 1fr 1fr;gap:1.6vw;align-items:center;padding:1.5vh .8vw;border-bottom:1px solid #e5e7eb;font-size:clamp(15px,1.4vw,26px)}
.rk.h{font-size:clamp(11px,.95vw,17px);font-weight:700;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid #d1d5db}
.rk.me{background:#f1f5ff;border-radius:1vh}.rk.me .nm{color:#2563eb;font-weight:800}
.cell{display:flex;align-items:center;gap:.8vw}
.bar{flex:1;height:1.1vh;border-radius:1vh;background:#e5e7eb;overflow:hidden;display:flex}
.bar i{display:block;height:100%;width:0;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.bar .m{background:#7c3aed}.bar .c{background:#2563eb}.bar .o{background:#f97316}.bar .p{background:#22c55e}.bar .n{background:#ef4444}
.cell b{min-width:4.6vw;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rk .k{color:#6b7280;font-weight:600}
.rk.hot{animation:hot 1.6s ease-in-out infinite}@keyframes hot{50%{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--p) 70%,transparent)}}
#s-cta{flex-direction:row;gap:5vw;text-align:left}
#s-cta .ctxt{max-width:46vw}
.rot{position:relative;height:clamp(30px,2.6vw,50px);margin-top:3.4vh;font-size:clamp(20px,2vw,38px);color:var(--w2)}
.rot span{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;transform:translateY(16px);transition:all .6s ease}
.rot span.on{opacity:1;transform:none}.rot b{color:#fff}
.steps{display:flex;gap:1.4vw;margin-top:4.4vh}
.steps div{padding:1.4vh 1.3vw;border-radius:1.6vh;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-size:clamp(14px,1.2vw,22px);font-weight:600}
.steps b{display:block;color:var(--a);font-size:clamp(20px,1.8vw,34px)}
.qrbox{flex:none;opacity:0;transform:scale(.7) rotate(-4deg);transition:all .9s cubic-bezier(.2,1.4,.4,1) .3s}
#s-cta.on .qrbox{opacity:1;transform:none}
.qr{width:min(58vh,36vw);padding:3vh;border-radius:3vh;background:#fff;display:block;animation:qrp 2.4s ease-in-out infinite}
@keyframes qrp{0%,100%{box-shadow:0 0 0 1.2vh rgba(255,255,255,.12),0 5vh 12vh rgba(0,0,0,.55)}50%{box-shadow:0 0 0 2.6vh color-mix(in srgb,var(--a) 30%,transparent),0 0 12vh color-mix(in srgb,var(--a) 55%,transparent)}}
.scanme{margin-top:2.4vh;text-align:center;font-weight:800;font-size:clamp(18px,1.8vw,34px)}
.scanme i{display:inline-block;font-style:normal;animation:bob 1.1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
#miniqr{position:fixed;right:2.2vw;bottom:3vh;z-index:30;display:flex;align-items:center;gap:1vw;padding:1.2vh 1.2vw;border-radius:2vh;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);opacity:0;transform:translateY(20px);transition:all .7s ease}
#miniqr.on{opacity:1;transform:none}
#miniqr svg{width:11vh;height:11vh;background:#fff;border-radius:1vh;padding:.8vh}
#miniqr span{font-size:clamp(13px,1.1vw,20px);font-weight:700;max-width:12vw;line-height:1.3}
#brand{position:fixed;left:2.2vw;top:3vh;z-index:30;display:flex;align-items:center;gap:.8vw;transition:opacity .6s}
#brand .clogo{height:4.6vh;min-width:4.6vh;padding:0 1.2vh;border-radius:1vh;font-size:2.6vh;box-shadow:none}
#brand .sflogo{height:5.4vh}
#brand .x{font-size:2.6vh}
#prog{position:fixed;left:0;right:0;bottom:0;height:4px;z-index:31;background:rgba(255,255,255,.08)}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--a))}
#amb{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:20}

(function(){const c=$('#amb'),x=c.getContext('2d');let W,H;const P=[];function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}
  addEventListener('resize',rs);rs();for(let i=0;i<60;i++)P.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.6,v:.00006+Math.random()*.0002,a:Math.random()*6.3,s:.4+Math.random()*1.2});
  (function lp(t){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
    x.beginPath();x.arc(p.x*W,p.y*H,p.r*devicePixelRatio,0,7);x.fillStyle=`rgba(255,255,255,${(.12+.28*(.5+.5*Math.sin(t/1000*p.s+p.a))).toFixed(3)})`;x.fill()}requestAnimationFrame(lp)})(0)})();
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}});
show(0);
</script>
</body></html>
